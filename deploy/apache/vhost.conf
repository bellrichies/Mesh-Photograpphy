# Mesh Photography — Apache VirtualHost (production)
# Place in /etc/apache2/sites-available/meshphoto.conf
# Enable with: a2ensite meshphoto && systemctl reload apache2

# ── Redirect HTTP → HTTPS ───────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName  meshphoto.com
    ServerAlias www.meshphoto.com

    RewriteEngine On
    RewriteRule ^ https://meshphoto.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── Redirect www → non-www (HTTPS) ──────────────────────────────────────────
<VirtualHost *:443>
    ServerName www.meshphoto.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/meshphoto.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/meshphoto.com/privkey.pem

    RewriteEngine On
    RewriteRule ^ https://meshphoto.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── Main site (HTTPS, non-www) ───────────────────────────────────────────────
<VirtualHost *:443>
    ServerName meshphoto.com
    ServerAdmin admin@meshphoto.com

    # SSL
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/meshphoto.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/meshphoto.com/privkey.pem
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # ── Frontend SPA (React build output) ───────────────────────────────────
    DocumentRoot /var/www/meshphoto/frontend/dist

    <Directory /var/www/meshphoto/frontend/dist>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        # React Router: send all non-file requests to index.html
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # ── Static asset caching ─────────────────────────────────────────────────
    <LocationMatch "\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|gif|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <Location "/index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>

    # ── Backend API (/api/*) → PHP ───────────────────────────────────────────
    Alias /api /var/www/meshphoto/backend/public

    <Directory /var/www/meshphoto/backend/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # ── Uploads served directly ──────────────────────────────────────────────
    Alias /uploads /var/www/meshphoto/backend/public/uploads

    <Directory /var/www/meshphoto/backend/public/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        AddType text/plain .php .php3 .phtml .pht
    </Directory>

    # ── Logging ──────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/meshphoto-error.log
    CustomLog ${APACHE_LOG_DIR}/meshphoto-access.log combined

    # ── Security headers (supplement PHP-layer headers) ──────────────────────
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</VirtualHost>

# Required Apache modules:
#   a2enmod rewrite ssl headers
